version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: examen3juan-mysql
    restart: unless-stopped
    # network_mode: host evita el docker-proxy que está bufereando/rompiendo
    # conexiones MySQL salientes en este host (ver WORK_LOG §13.6).
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: ${DB_NAME:-examen3juan}
      MYSQL_USER: ${DB_USER:-examenjuan}
      MYSQL_PASSWORD: ${DB_PASSWORD:-examen_pass}
    volumes:
      - examen3juan_mysql_data:/var/lib/mysql
    # Sin ports: con network_mode: host, MySQL escucha en 127.0.0.1:3306.
    # El 3306 del host está libre (los otros mysql usan 3307, 3308, 3309, 3310, 3311).
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    image: node:20-alpine
    container_name: examen3juan-backend
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    command: ["node", "src/server.js"]
    volumes:
      # Montamos el código y node_modules ya instalado en el host.
      # Evita el bug de `npm install` en node:20-alpine que dejaba
      # node_modules con carpetas vacías (ver WORK_LOG §13.4).
      - ./backend/src:/app/src:ro
      - ./backend/public:/app/public:ro
      - ./backend/.env:/app/.env:ro
      - ./backend/node_modules:/app/node_modules
    environment:
      NODE_ENV: production
      PORT: 3010
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: ${DB_USER:-examenjuan}
      DB_PASSWORD: ${DB_PASSWORD:-examen_pass}
      DB_NAME: ${DB_NAME:-examen3juan}
      EXTERNAL_IMAGE_BASE_URL: https://picsum.photos
      EXTERNAL_IMAGE_WIDTH: 600
      EXTERNAL_IMAGE_HEIGHT: 400
      CORS_ORIGIN: "*"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  examen3juan_mysql_data:
    driver: local
